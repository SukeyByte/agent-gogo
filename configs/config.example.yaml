server:
  host: "127.0.0.1"
  port: 8080

llm:
  provider: "deepseek"
  model: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com"
  api_key: "${DEEPSEEK_API_KEY}"
  timeout: 120
  thinking_enabled: false
  reasoning_effort: ""

browser:
  provider: "chrome_mcp"
  mcp_url: "http://127.0.0.1:9222"
  auto_start_mcp: true
  debug_port: 9223
  chrome_path: ""
  user_data_dir: ""
  headless: false
  timeout: 60
  max_summary_length: 12000

communication:
  channel_id: "cli"
  session_id: "local"

storage:
  workspace_path: "."
  sqlite_path: "./data/agent.db"
  artifact_path: "./data/artifacts"
  log_path: "./logs"
  skill_roots:
    - ".claude/skills"
  persona_path: "./personas"

runtime:
  max_tasks_per_project: 50
  # How many tasks of one project may execute at once (1 = sequential).
  max_parallel_tasks: 1
  test_command: "go test ./..."
  context_max_chars: 60000
  max_retries: 3
  token_budget: 32000
  enable_prompt_cache: true
  enable_auto_repair: true

security:
  require_confirm_high_risk: true
  allow_shell: false
  shell_allowlist:
    - "go test"
    - "go build"
    - "go run"
    - "git status"
    - "git diff"

# External MCP servers: tools are registered as mcp.<name>.<tool>.
# Use command+args for stdio servers, or url for streamable HTTP servers.
